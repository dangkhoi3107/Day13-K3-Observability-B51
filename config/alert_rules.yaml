alerts:
  - name: HighLatencyP95
    severity: critical
    condition: "p95_latency_ms > 3000ms for 5m"
    type: symptom-based
    owner: oncall-devops
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% for 5m"
    type: symptom-based
    owner: oncall-devops
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: "quality_score_avg < 0.75 for 10m"
    type: symptom-based
    owner: ai-team
    runbook: docs/alerts.md#alert-3
